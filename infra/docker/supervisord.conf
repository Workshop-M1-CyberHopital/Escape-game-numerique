; ==============================================================================
; Supervisord - conteneur Escape Game Cyber-Hôpital
; ==============================================================================
; supervisord est le PID 1 du conteneur (CMD du Dockerfile, sans shell intermédiaire) :
;  - il reçoit directement SIGTERM (docker stop / arrêt d'un pod) et arrête proprement Nginx puis Node.js ;
;  - la sortie des deux programmes part sur stdout/stderr du conteneur (docker logs / kubectl logs) ;
;  - `supervisorctl status|restart nodejs|restart nginx` fonctionne via le socket unix ci-dessous.
; Copié dans l'image en /etc/supervisord.conf (emplacement lu par défaut par supervisorctl).
; ==============================================================================

[supervisord]
nodaemon=true
user=root
; nodaemon=true : les messages de supervisord sont déjà écrits sur stdout, pas besoin de fichier.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

; API Node.js/Express (port 3001). Démarrée en premier, arrêtée en dernier.
; SIGTERM déclenche l'arrêt gracieux de main.js (fin des requêtes en cours avant sortie).
[program:nodejs]
command=node main.js
directory=/app/back
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Nginx (port 80) : frontend statique + proxy /api/ -> 127.0.0.1:3001.
; SIGQUIT = arrêt gracieux de Nginx (termine les requêtes en cours).
[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
