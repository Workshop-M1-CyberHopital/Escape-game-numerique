# ==============================================================================
# Nginx du conteneur Escape Game Cyber-Hôpital
# ==============================================================================
#  - sert le frontend Vue (build Vite copié dans /usr/share/nginx/html) ;
#  - relaie /api/ vers l'API Node.js du même conteneur (127.0.0.1:3001) : le frontend de production
#    appelle l'API sur la même origine, sans CORS ni port 3001 exposé ;
#  - journalise sur stdout/stderr (docker logs / kubectl logs).
# ==============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs vers la sortie du conteneur (relayés par supervisord)
    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        image/x-icon;

    # Schéma d'origine transmis à l'API : on conserve celui d'un reverse proxy amont
    # (Traefik termine le HTTPS en Kubernetes), sinon celui de la connexion reçue.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # NB : un bloc location qui contient un add_header n'hérite d'AUCUN add_header du niveau
        # server. Les en-têtes de sécurité sont donc répétés dans chaque location statique.

        # --- API Node.js (même conteneur) --------------------------------------------------------
        # Pas d'URI après l'adresse : /api/auth/login est transmis tel quel à Express.
        # ^~ : les locations regex (fichiers statiques) ne peuvent jamais capturer une URL d'API.
        # Les en-têtes de sécurité / cache des réponses API sont posés par Express (helmet).
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 1m;
        }

        # --- index.html : toujours revalidé ----------------------------------------------------------
        # Il référence les fichiers hashés du dernier build : un index.html en cache après un
        # redéploiement chargerait des chunks qui n'existent plus. Le fallback SPA ci-dessous
        # (try_files ... /index.html) aboutit aussi ici, donc les liens profonds sont couverts.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Assets Vite hashés (/assets/<nom>-<hash>.js|css|…) : immuables ---------------------------
        # Le nom change à chaque modification : cache d'un an sans revalidation.
        # Un chunk absent renvoie 404 (jamais index.html servi à la place d'un script).
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- Autres fichiers publics non hashés (planches Ishihara, mascotte, sons, favicon…) -------
        # Leur nom ne change pas quand on les remplace : cache court (1 h) pour qu'une correction
        # publiée pendant un atelier arrive vite chez les joueurs.
        location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp3|wav|ogg|m4a|webm|mp4|woff2?|ttf|otf|json|txt|pdf)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- Application monopage Vue ----------------------------------------------------------------
        # Toute autre route est servie par index.html (voir la location = /index.html).
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
